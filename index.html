<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FanClub – Football Social Platform</title>
  <meta name="description" content="FanClub — The ultimate football fan community. Connect with fans, follow clubs, earn rewards.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Desktop presentation scene -->
  <div class="desktop-scene" id="desktop-scene">
    <div class="scene-bg-text">FANCLUB</div>
    <div class="scene-glow"></div>

    <!-- Phone device frame -->
    <div class="phone-device" id="phone-device">
      <div class="phone-notch"></div>

      <!-- iOS-style status bar -->
      <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="status-icons">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="white" aria-hidden="true">
            <rect x="0" y="6" width="3" height="6" rx="1" opacity="0.35"/>
            <rect x="4.5" y="3.5" width="3" height="8.5" rx="1" opacity="0.55"/>
            <rect x="9" y="1.5" width="3" height="10.5" rx="1" opacity="0.75"/>
            <rect x="13.5" y="0" width="3" height="12" rx="1"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="white" aria-hidden="true">
            <path d="M8 9C8.83 9 9.5 9.67 9.5 10.5S8.83 12 8 12 6.5 11.33 6.5 10.5 7.17 9 8 9Z"/>
            <path d="M8 6C9.69 6 11.24 6.69 12.36 7.84L13.5 6.7C12.02 5.22 10 4.33 8 4.33S3.98 5.22 2.5 6.7L3.64 7.84C4.76 6.69 6.31 6 8 6Z" opacity="0.75"/>
            <path d="M8 3C10.61 3 12.97 4.03 14.66 5.75L15.8 4.61C13.74 2.56 10.99 1.33 8 1.33S2.26 2.56.2 4.61L1.34 5.75C3.03 4.03 5.39 3 8 3Z" opacity="0.4"/>
          </svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="white" aria-hidden="true">
            <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="white" stroke-opacity="0.45" fill="none"/>
            <rect x="22" y="4" width="3.5" height="4" rx="1.75" fill="white" fill-opacity="0.45"/>
            <rect x="1.5" y="1.5" width="18" height="9" rx="1.5" fill="white"/>
          </svg>
        </div>
      </div>

      <!-- App -->
      <div class="app-shell">
        <header class="app-header" id="app-header" role="banner"></header>
        <main class="page-container" id="page-container" role="main"></main>

        <nav class="bottom-nav" id="bottom-nav" role="navigation" aria-label="Main navigation">
          <button class="nav-item active" data-page="home" id="nav-btn-home" aria-label="Home">
            <div class="nav-icon" id="nav-icon-home"></div>
            <span class="nav-label">Home</span>
            <div class="nav-active-dot"></div>
          </button>
          <button class="nav-item" data-page="explore" id="nav-btn-explore" aria-label="Explore">
            <div class="nav-icon" id="nav-icon-explore"></div>
            <span class="nav-label">Explore</span>
            <div class="nav-active-dot"></div>
          </button>
          <button class="nav-item" data-page="live" id="nav-btn-live" aria-label="Live">
            <div class="nav-icon" id="nav-icon-live"></div>
            <span class="nav-label">Live</span>
            <div class="nav-active-dot"></div>
          </button>
          <button class="nav-item" data-page="reward" id="nav-btn-reward" aria-label="Reward">
            <div class="nav-icon" id="nav-icon-reward"></div>
            <span class="nav-label">Reward</span>
            <div class="nav-active-dot"></div>
          </button>
          <button class="nav-item" data-page="profile" id="nav-btn-profile" aria-label="Profile">
            <div class="nav-icon" id="nav-icon-profile"></div>
            <span class="nav-label">Profile</span>
            <div class="nav-active-dot"></div>
          </button>
        </nav>
      </div>
    </div>
  </div>

  <!-- Create Post Modal -->
  <div class="modal-overlay hidden" id="create-post-modal" role="dialog" aria-modal="true" aria-label="Create Post">
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <span class="modal-title">New Post</span>
        <button class="btn-icon-ghost" id="close-modal-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="post-composer">
          <div class="composer-avatar" id="composer-avatar"></div>
          <div class="composer-input-wrap">
            <textarea class="composer-textarea" id="post-textarea" placeholder="Share your thoughts with the football world..." rows="4" aria-label="Post content"></textarea>
          </div>
        </div>
        <div class="composer-actions">
          <div class="composer-tags" id="composer-tags">
            <button class="tag-chip active" data-community="arsenal-fc-official">#Arsenal</button>
            <button class="tag-chip" data-community="transfer-rumours">#Transfers</button>
            <button class="tag-chip" data-community="ucl-weekly">#UCL</button>
          </div>
          <button class="btn-primary btn-post" id="submit-post-btn">Post</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
